<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Rounded Shield / Icon Container -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" />
  <rect width="94" height="94" x="3" y="3" rx="19" fill="none" stroke="#059669" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Brazilian Flag Stylized Diamond (Losango) -->
  <polygon points="50,16 85,50 50,84 15,50" fill="url(#goldGrad)" filter="url(#shadow)" />

  <!-- Center Circle (Globo Celeste) -->
  <circle cx="50" cy="50" r="21" fill="#047857" />
  <circle cx="50" cy="50" r="19" fill="#064E3B" stroke="#FDE047" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Civic Scales / Balance & Letters -->
  <!-- White Arch (Faixa) -->
  <path d="M 33 53 Q 50 44 67 53" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Star on top -->
  <polygon points="50,36 51.5,40 55.5,40.5 52.5,43 53.5,47 50,44.5 46.5,47 47.5,43 44.5,40.5 48.5,40" fill="#FFFFFF" />

  <!-- Monogram BR -->
  <text x="50" y="65" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="11" fill="#FEF08A" text-anchor="middle" letter-spacing="1">BR</text>
</svg>
